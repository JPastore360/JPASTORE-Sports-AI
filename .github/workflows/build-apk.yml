name: Gerar APK J.Pastore Sports AI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'JPASTORE_SPORTS_AI_ANDROID_PROJECT.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK necessario
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager nao encontrado em $SDKMANAGER"
            find "$ANDROID_HOME" -name sdkmanager -type f -print || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descompactar projeto
        shell: bash
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q JPASTORE_SPORTS_AI_ANDROID_PROJECT.zip -d build-src
          test -f build-src/JPASTORE_SPORTS_AI_ANDROID/settings.gradle
          echo "Projeto Android encontrado."

      - name: Compilar APK
        working-directory: build-src/JPASTORE_SPORTS_AI_ANDROID
        run: gradle --no-daemon :app:assembleDebug

      - name: Preparar APK para download
        shell: bash
        run: |
          mkdir -p output
          cp build-src/JPASTORE_SPORTS_AI_ANDROID/app/build/outputs/apk/debug/app-debug.apk output/JPASTORE-Sports-AI.apk
          ls -lh output/JPASTORE-Sports-AI.apk

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: JPASTORE-Sports-AI-APK
          path: output/JPASTORE-Sports-AI.apk
          if-no-files-found: error
          retention-days: 30
          
