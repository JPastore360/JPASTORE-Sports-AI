name: Gerar APK J.Pastore Sports AI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'JPASTORE_SPORTS_AI_ANDROID_PROJECT.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      PROJECT_ZIP: JPASTORE_SPORTS_AI_ANDROID_PROJECT.zip
      EXPECTED_BUILD: JP-MULTISPORT-FULL-ANALYSIS-5.3.0

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Validar ZIP oficial
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$PROJECT_ZIP" ]; then
            echo "ERRO: envie/substitua exatamente $PROJECT_ZIP na raiz do repositorio."
            exit 1
          fi
          echo "ZIP oficial: $PROJECT_ZIP"
          sha256sum "$PROJECT_ZIP"

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android API 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descompactar projeto
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-src output
          mkdir -p build-src output
          unzip -q "$PROJECT_ZIP" -d build-src
          test -f build-src/JPASTORE_SPORTS_AI_ANDROID/settings.gradle

      - name: Confirmar versao 5.3 e analise completa
        shell: bash
        run: |
          set -euo pipefail
          ROOT=build-src/JPASTORE_SPORTS_AI_ANDROID
          MARKER="$ROOT/FULL_ANALYSIS_BUILD_5_3.txt"
          VIEW="$ROOT/app/src/main/java/com/jpastore/sportsai/PremiumView.java"
          GRADLE="$ROOT/app/build.gradle"

          if [ ! -f "$MARKER" ] || ! grep -Fq "$EXPECTED_BUILD" "$MARKER"; then
            echo "ERRO: PROJETO ANTIGO DETECTADO. O ZIP nao contem a versao 5.3 de analise completa."
            exit 1
          fi
          grep -Fq "versionCode 45" "$GRADLE" || { echo "ERRO: versionCode esperado 45 nao encontrado."; exit 1; }
          grep -Fq "5.3.0-multisport-full-analysis" "$GRADLE" || { echo "ERRO: versionName 5.3 nao encontrado."; exit 1; }
          grep -Fq "JP-MULTISPORT-FULL-ANALYSIS-5.3.0" "$VIEW" || { echo "ERRO: tela de analise 5.3 ausente."; exit 1; }
          grep -Fq "openSportEvent(sportEvents.get(ei))" "$VIEW" || { echo "ERRO: clique multiesporte nao aponta para analise completa."; exit 1; }
          if grep -Fq "TOQUE PARA DETALHES" "$VIEW"; then
            echo "ERRO: popup antigo ainda existe nesta fonte."
            exit 1
          fi
          echo "OK: J.Pastore Sports AI 5.3 ANALISE COMPLETA confirmado antes da compilacao."

      - name: Compilar APK
        working-directory: build-src/JPASTORE_SPORTS_AI_ANDROID
        run: gradle --no-daemon :app:assembleDebug

      - name: Localizar e validar APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find build-src/JPASTORE_SPORTS_AI_ANDROID/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "ERRO: APK nao encontrado."
            exit 1
          fi
          cp "$APK" output/JPASTORE-Sports-AI.apk
          test -s output/JPASTORE-Sports-AI.apk
          ls -lh output/JPASTORE-Sports-AI.apk
          sha256sum output/JPASTORE-Sports-AI.apk

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: JPASTORE-Sports-AI-APK
          path: output/JPASTORE-Sports-AI.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          
