name: Gerar APK J.Pastore Sports AI

on:
  workflow_dispatch:
  push:
    branches: [ main, principal ]
    paths:
      - 'JPASTORE_SPORTS_AI_ANDROID_PROJECT*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Localizar projeto J.Pastore Sports AI
        shell: bash
        run: |
          set -euo pipefail

          is_valid_project() {
            local z="$1"
            [ -f "$z" ] || return 1

            unzip -l "$z" JPASTORE_SPORTS_AI_ANDROID/settings.gradle 2>/dev/null | grep -Fq "settings.gradle" || return 1
            unzip -l "$z" JPASTORE_SPORTS_AI_ANDROID/app/build.gradle 2>/dev/null | grep -Fq "app/build.gradle" || return 1
            unzip -l "$z" JPASTORE_SPORTS_AI_ANDROID/app/src/main/AndroidManifest.xml 2>/dev/null | grep -Fq "AndroidManifest.xml" || return 1

            local gradle
            gradle="$(unzip -p "$z" JPASTORE_SPORTS_AI_ANDROID/app/build.gradle 2>/dev/null || true)"
            printf '%s\n' "$gradle" | grep -Eq "applicationId[[:space:]]+['\"]com\.jpastore\.sportsai['\"]" || return 1

            return 0
          }

          PROJECT_ZIP=""

          # 1) Em push, prioriza um ZIP valido alterado neste commit.
          if [ "${{ github.event_name }}" = "push" ]; then
            while IFS= read -r candidate; do
              [ -n "$candidate" ] || continue
              if [[ "$candidate" =~ ^JPASTORE_SPORTS_AI_ANDROID_PROJECT.*\.zip$ ]] && is_valid_project "$candidate"; then
                PROJECT_ZIP="$candidate"
              fi
            done < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" || true)
          fi

          # 2) Prefere o nome oficial quando valido.
          if [ -z "$PROJECT_ZIP" ] && is_valid_project "JPASTORE_SPORTS_AI_ANDROID_PROJECT.zip"; then
            PROJECT_ZIP="JPASTORE_SPORTS_AI_ANDROID_PROJECT.zip"
          fi

          # 3) Fallback: escolhe o ZIP valido mais recente no historico do Git.
          if [ -z "$PROJECT_ZIP" ]; then
            BEST_TS=0
            while IFS= read -r candidate; do
              [ -n "$candidate" ] || continue
              if is_valid_project "$candidate"; then
                TS="$(git log -1 --format=%ct -- "$candidate" 2>/dev/null || echo 0)"
                TS="${TS:-0}"
                if [ "$TS" -ge "$BEST_TS" ]; then
                  BEST_TS="$TS"
                  PROJECT_ZIP="$candidate"
                fi
              fi
            done < <(find . -maxdepth 1 -type f -name 'JPASTORE_SPORTS_AI_ANDROID_PROJECT*.zip' -printf '%f\n' | sort)
          fi

          if [ -z "$PROJECT_ZIP" ]; then
            echo "ERRO: nenhum ZIP valido do J.Pastore Sports AI foi encontrado."
            echo "O ZIP precisa conter JPASTORE_SPORTS_AI_ANDROID/ e applicationId com.jpastore.sportsai."
            exit 1
          fi

          echo "Projeto selecionado: $PROJECT_ZIP"
          sha256sum "$PROJECT_ZIP"
          echo "PROJECT_ZIP=$PROJECT_ZIP" >> "$GITHUB_ENV"

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK e API 35
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n 1 || true)"

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager nao encontrado no GitHub Runner."
            find "$ANDROID_HOME" -maxdepth 5 -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "Usando sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true

          PACKAGES=()
          [ -d "$ANDROID_HOME/platform-tools" ] || PACKAGES+=("platform-tools")
          [ -d "$ANDROID_HOME/platforms/android-35" ] || PACKAGES+=("platforms;android-35")
          [ -d "$ANDROID_HOME/build-tools/35.0.0" ] || PACKAGES+=("build-tools;35.0.0")

          if [ "${#PACKAGES[@]}" -gt 0 ]; then
            "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "${PACKAGES[@]}"
          fi

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descompactar projeto
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-src output
          mkdir -p build-src output
          unzip -q "$PROJECT_ZIP" -d build-src

          ROOT=build-src/JPASTORE_SPORTS_AI_ANDROID
          test -f "$ROOT/settings.gradle"
          test -f "$ROOT/app/build.gradle"
          test -f "$ROOT/app/src/main/AndroidManifest.xml"

          grep -Eq "applicationId[[:space:]]+['\"]com\.jpastore\.sportsai['\"]" "$ROOT/app/build.gradle" || {
            echo "ERRO: applicationId divergente."
            exit 1
          }

          VERSION_CODE="$(sed -nE 's/.*versionCode[[:space:]]+([0-9]+).*/\1/p' "$ROOT/app/build.gradle" | head -n1 || true)"
          VERSION_NAME="$(sed -nE "s/.*versionName[[:space:]]+['\"]([^'\"]+)['\"].*/\1/p" "$ROOT/app/build.gradle" | head -n1 || true)"

          echo "J.Pastore Sports AI"
          echo "versionCode: ${VERSION_CODE:-nao identificado}"
          echo "versionName: ${VERSION_NAME:-nao identificado}"
          echo "APP_VERSION_CODE=${VERSION_CODE:-unknown}" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=${VERSION_NAME:-unknown}" >> "$GITHUB_ENV"

      - name: Confirmar versão 6.9.1 Logo Optimizer
        shell: bash
        run: |
          set -euo pipefail
          ROOT=build-src/JPASTORE_SPORTS_AI_ANDROID
          test "${APP_VERSION_CODE}" = "62" || { echo "ERRO: projeto não é versionCode 62 (6.9.1)."; exit 1; }
          grep -Fq "6.9.1-turbo-logo-optimizer" "$ROOT/app/build.gradle" || { echo "ERRO: versionName 6.9.1 não encontrado."; exit 1; }
          test -f "$ROOT/FULL_ANALYSIS_BUILD_6_9_1" || { echo "ERRO: marcador 6.9.1 ausente."; exit 1; }
          SRC="$ROOT/app/src/main/java/com/jpastore/sportsai"
          WEB="$SRC/MultiSportWebClient.java"
          MULTI="$SRC/MultiSportClient.java"
          API="$SRC/ApiClient.java"
          CONS="$SRC/SportConsensusEngine.java"
          TICKET="$SRC/SportTicketEngine.java"
          UI="$SRC/PremiumView.java"
          test -f "$SRC/ResearchProgress.java" || { echo "ERRO: progresso real de pesquisa ausente."; exit 1; }
          test -f "$SRC/TeamIdentityResolver.java" || { echo "ERRO: resolvedor de aliases ausente."; exit 1; }
          grep -Fq "loadPublicSchedule" "$MULTI" || { echo "ERRO: agenda pública Internet First ausente."; exit 1; }
          grep -Fq "researchDeep" "$WEB" || { echo "ERRO: Análise Profunda multiesporte ausente."; exit 1; }
          grep -Fq "deepWebSweep" "$WEB" || { echo "ERRO: varredura web aprofundada ausente."; exit 1; }
          grep -Fq "researchPublicOnly" "$WEB" || { echo "ERRO: pesquisa pública unificada ausente."; exit 1; }
          grep -Fq "deep_v69_turbo_" "$API" || { echo "ERRO: cache Turbo Research 6.9 do futebol ausente."; exit 1; }
          grep -Fq "Consensus Intelligence Engine (6.4" "$CONS" || { echo "ERRO: consenso 6.4 ausente."; exit 1; }
          test -f "$SRC/StatisticalCalibrationEngine.java" || { echo "ERRO: motor central de calibração ausente."; exit 1; }
          grep -Fq "confidenceScore" "$TICKET" || { echo "ERRO: Confidence Score não integrado ao ticket engine."; exit 1; }
          grep -Fq "jointProbability" "$SRC/TicketStore.java" || { echo "ERRO: probabilidade conjunta do bilhete ausente."; exit 1; }
          grep -Fq "JP-TURBO-MULTI-API-ENGINE-6.9.1-LOGO" "$UI" || { echo "ERRO: marcador interno 6.9.1 ausente."; exit 1; }
          grep -Fq "publicFootballGames(String date)" "$API" || { echo "ERRO: helper de agenda pública do futebol ausente."; exit 1; }
          grep -Fq "ANÁLISE PROFUNDA • INTERNET" "$UI" || { echo "ERRO: Análise Profunda do futebol ausente."; exit 1; }
          grep -Fq "splashProgress" "$UI" || { echo "ERRO: barra de progresso real da abertura ausente."; exit 1; }
          grep -Fq -- "-angle*1.55f" "$UI" || { echo "ERRO: rotação oposta da bola ausente."; exit 1; }
          grep -Fq "loadEspnSchedule" "$MULTI" || { echo "ERRO: fallback ESPN público ausente."; exit 1; }
          grep -Fq "loadSportsDbSchedule" "$MULTI" || { echo "ERRO: fallback TheSportsDB ausente."; exit 1; }
          grep -Fq "loadOpenWebSchedule" "$MULTI" || { echo "ERRO: fallback web aberto ausente."; exit 1; }
          grep -Fq "apiCircuitOpen" "$MULTI" || { echo "ERRO: circuit breaker de quota ausente."; exit 1; }
          grep -Fq "readResilientSchedule" "$MULTI" || { echo "ERRO: cache resiliente ausente."; exit 1; }
          test -f "$SRC/MarketOddsBook.java" || { echo "ERRO: livro de odds sem margem ausente."; exit 1; }
          test -f "$SRC/MarketOddsClient.java" || { echo "ERRO: cliente opcional de odds ausente."; exit 1; }
          test -f "$SRC/LiveAnalysisEngine.java" || { echo "ERRO: modelo AO VIVO separado ausente."; exit 1; }
          grep -Fq "odds/live?fixture=" "$SRC/MarketOddsClient.java" || { echo "ERRO: odds AO VIVO separadas não integradas."; exit 1; }
          grep -Fq "poissonOutcome" "$SRC/StatisticalCalibrationEngine.java" || { echo "ERRO: modelo Poisson 1X2 próprio ausente."; exit 1; }
          grep -Fq "normalHandicapProbability" "$SRC/StatisticalCalibrationEngine.java" || { echo "ERRO: handicap positivo calibrado ausente."; exit 1; }
          grep -Fq "loadOptionalOdds" "$WEB" || { echo "ERRO: odds opcionais multiesporte ausentes."; exit 1; }
          grep -Fq "static String today()" "$API" || { echo "ERRO: helper ApiClient.today ausente."; exit 1; }
          grep -Fq "static String future(int days)" "$API" || { echo "ERRO: helper ApiClient.future ausente."; exit 1; }
          grep -Fq "static int pct(String s)" "$API" || { echo "ERRO: helper ApiClient.pct ausente."; exit 1; }
          grep -Fq "leagueGoalMean" "$SRC/WebDataClient.java" || { echo "ERRO: média histórica da competição não integrada ao motor de gols."; exit 1; }
          grep -Fq "leagueMean" "$API" || { echo "ERRO: média da competição não persistida na projeção de gols."; exit 1; }
          test -f "$SRC/FiveDollarFootballClient.java" || { echo "ERRO: cliente 5DollarFootballAPI ausente."; exit 1; }
          grep -Fq 'api_5dollar' "$SRC/FiveDollarFootballClient.java" || { echo "ERRO: armazenamento da chave 5Dollar ausente."; exit 1; }
          grep -Fq 'Authorization","Bearer ' "$SRC/FiveDollarFootballClient.java" || { echo "ERRO: autenticação Bearer 5Dollar ausente."; exit 1; }
          grep -Fq 'FiveDollarFootballClient.key(c)' "$API" || { echo "ERRO: rota FAST 5Dollar não integrada ao ApiClient."; exit 1; }
          # Valida a integração pela lógica da tela, não por um rótulo visual exato.
          # Isso evita falso negativo quando o texto exibido muda (ex.: "FUTEBOL FAST").
          grep -Fq 'FiveDollarFootballClient.SOURCE.equals(selectedApiSource)' "$UI" || { echo "ERRO: fonte 5Dollar não ligada à tela de APIs."; exit 1; }
          grep -Fq 'fiveDollarApiDialog()' "$UI" || { echo "ERRO: diálogo para colar/alterar a chave 5Dollar ausente."; exit 1; }
          grep -Fq 'CONFIGURAR / COLAR CHAVE' "$UI" || { echo "ERRO: campo de colar chave ausente na interface."; exit 1; }
          test -f "$SRC/HighlightlyBasketballClient.java" || { echo "ERRO: cliente Highlightly Basketball ausente."; exit 1; }
          grep -Fq 'api_highlightly_basketball' "$SRC/HighlightlyBasketballClient.java" || { echo "ERRO: armazenamento persistente da chave Highlightly ausente."; exit 1; }
          grep -Fq 'https://basketball.highlightly.net/' "$SRC/HighlightlyBasketballClient.java" || { echo "ERRO: endpoint oficial Highlightly Basketball ausente."; exit 1; }
          grep -Fq 'last-five-games?teamId=' "$SRC/HighlightlyBasketballClient.java" || { echo "ERRO: forma recente Highlightly ausente."; exit 1; }
          grep -Fq 'head-2-head?teamIdOne=' "$SRC/HighlightlyBasketballClient.java" || { echo "ERRO: H2H Highlightly ausente."; exit 1; }
          grep -Fq 'HighlightlyBasketballClient.SOURCE.equals(selectedApiSource)' "$UI" || { echo "ERRO: fonte Highlightly não ligada à tela de APIs."; exit 1; }
          grep -Fq 'highlightlyBasketballApiDialog()' "$UI" || { echo "ERRO: diálogo para colar/alterar a chave Highlightly ausente."; exit 1; }
          grep -Fq 'timedOpenWebHistory' "$WEB" || { echo "ERRO: orçamento de tempo da web aberta ausente."; exit 1; }
          grep -Fq 'homeDisplayGames' "$UI" || { echo "ERRO: correção da tela inicial do futebol ausente."; exit 1; }
          grep -Fq 'sofaTeamImage' "$MULTI" || { echo "ERRO: URLs diretas de escudos SofaScore ausentes."; exit 1; }
          grep -Fq 'e.homeId=h.optLong("id",0)' "$MULTI" || { echo "ERRO: ID do mandante SofaScore não preservado."; exit 1; }
          grep -Fq 'resolveTeamBadgeSmart' "$UI" || { echo "ERRO: fallback inteligente de escudos ausente."; exit 1; }
          grep -Fq 'teamInitials' "$UI" || { echo "ERRO: fallback visual por iniciais ausente."; exit 1; }
          if grep -Fq 'center(c,"FC"' "$UI"; then echo "ERRO: fallback genérico FC ainda presente."; exit 1; fi
          echo "Versão 6.9.1 validada: Turbo Multi-API + Logo Optimizer + cache assíncrono de escudos."

      - name: Rodar testes do Logo Optimizer
        shell: bash
        run: |
          set -euo pipefail
          bash build-src/JPASTORE_SPORTS_AI_ANDROID/tools/logo-optimizer-selftest.sh build-src/JPASTORE_SPORTS_AI_ANDROID

      - name: Rodar 20 testes do motor estatístico calibrado
        working-directory: build-src/JPASTORE_SPORTS_AI_ANDROID
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/jp-ai-tests && mkdir -p /tmp/jp-ai-tests
          javac -encoding UTF-8 -d /tmp/jp-ai-tests \
            app/src/main/java/com/jpastore/sportsai/StatisticalCalibrationEngine.java \
            app/src/main/java/com/jpastore/sportsai/MarketOddsBook.java \
            tools/StatisticalCalibrationEngineSelfTest.java
          java -cp /tmp/jp-ai-tests com.jpastore.sportsai.StatisticalCalibrationEngineSelfTest

      - name: Compilar APK com retry anti-429
        working-directory: build-src/JPASTORE_SPORTS_AI_ANDROID
        shell: bash
        run: |
          set -euo pipefail

          # Reduz concorrencia para evitar rajadas de downloads no Maven Central.
          export GRADLE_OPTS="-Dorg.gradle.workers.max=2 -Dorg.gradle.parallel=false -Dorg.gradle.daemon=false"

          MAX_ATTEMPTS=4
          for ATTEMPT in $(seq 1 $MAX_ATTEMPTS); do
            echo "Tentativa $ATTEMPT de $MAX_ATTEMPTS para compilar o APK..."
            LOG="/tmp/jpastore-gradle-${ATTEMPT}.log"

            set +e
            gradle --no-daemon --max-workers=2 :app:assembleDebug 2>&1 | tee "$LOG"
            CODE=${PIPESTATUS[0]}
            set -e

            if [ "$CODE" -eq 0 ]; then
              echo "Compilacao concluida com sucesso."
              exit 0
            fi

            # Retry somente para falhas transitórias de rede/repositório.
            if grep -Eqi '429|Too Many Requests|Could not GET|Could not resolve|Read timed out|Connection reset|Temporary failure|503 Service Unavailable' "$LOG"; then
              if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
                WAIT=$((ATTEMPT * 45))
                echo "Falha temporaria de rede/dependencias. Aguardando ${WAIT}s antes de tentar novamente..."
                sleep "$WAIT"
                continue
              fi
            else
              echo "ERRO de codigo/compilacao detectado. Nao sera repetido 4 vezes."
              grep -nE 'error:|cannot find symbol|incompatible types|not a statement|illegal start|unclosed' "$LOG" | tail -n 40 || true
              exit "$CODE"
            fi
          done

          echo "ERRO: a compilacao falhou apos $MAX_ATTEMPTS tentativas de rede."
          exit 1

      - name: Localizar e validar APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find build-src/JPASTORE_SPORTS_AI_ANDROID/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERRO: APK nao encontrado."
            exit 1
          fi

          cp "$APK" output/JPASTORE-Sports-AI.apk
          test -s output/JPASTORE-Sports-AI.apk
          ls -lh output/JPASTORE-Sports-AI.apk
          sha256sum output/JPASTORE-Sports-AI.apk

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: JPASTORE-Sports-AI-APK
          path: output/JPASTORE-Sports-AI.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
