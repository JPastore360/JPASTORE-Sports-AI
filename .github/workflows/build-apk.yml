name: Gerar APK J.Pastore Sports AI

on:
  workflow_dispatch:
  push:
    branches: [ main, principal ]
    paths:
      - 'JPASTORE_SPORTS_AI_ANDROID_PROJECT*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Localizar projeto J.Pastore Sports AI
        shell: bash
        run: |
          set -euo pipefail

          is_valid_project() {
            local z="$1"
            [ -f "$z" ] || return 1

            unzip -l "$z" JPASTORE_SPORTS_AI_ANDROID/settings.gradle 2>/dev/null | grep -Fq "settings.gradle" || return 1
            unzip -l "$z" JPASTORE_SPORTS_AI_ANDROID/app/build.gradle 2>/dev/null | grep -Fq "app/build.gradle" || return 1
            unzip -l "$z" JPASTORE_SPORTS_AI_ANDROID/app/src/main/AndroidManifest.xml 2>/dev/null | grep -Fq "AndroidManifest.xml" || return 1

            local gradle
            gradle="$(unzip -p "$z" JPASTORE_SPORTS_AI_ANDROID/app/build.gradle 2>/dev/null || true)"
            printf '%s\n' "$gradle" | grep -Eq "applicationId[[:space:]]+['\"]com\.jpastore\.sportsai['\"]" || return 1

            return 0
          }

          PROJECT_ZIP=""

          # 1) Em push, prioriza um ZIP valido alterado neste commit.
          if [ "${{ github.event_name }}" = "push" ]; then
            while IFS= read -r candidate; do
              [ -n "$candidate" ] || continue
              if [[ "$candidate" =~ ^JPASTORE_SPORTS_AI_ANDROID_PROJECT.*\.zip$ ]] && is_valid_project "$candidate"; then
                PROJECT_ZIP="$candidate"
              fi
            done < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" || true)
          fi

          # 2) Prefere o nome oficial quando valido.
          if [ -z "$PROJECT_ZIP" ] && is_valid_project "JPASTORE_SPORTS_AI_ANDROID_PROJECT.zip"; then
            PROJECT_ZIP="JPASTORE_SPORTS_AI_ANDROID_PROJECT.zip"
          fi

          # 3) Fallback: escolhe o ZIP valido mais recente no historico do Git.
          if [ -z "$PROJECT_ZIP" ]; then
            BEST_TS=0
            while IFS= read -r candidate; do
              [ -n "$candidate" ] || continue
              if is_valid_project "$candidate"; then
                TS="$(git log -1 --format=%ct -- "$candidate" 2>/dev/null || echo 0)"
                TS="${TS:-0}"
                if [ "$TS" -ge "$BEST_TS" ]; then
                  BEST_TS="$TS"
                  PROJECT_ZIP="$candidate"
                fi
              fi
            done < <(find . -maxdepth 1 -type f -name 'JPASTORE_SPORTS_AI_ANDROID_PROJECT*.zip' -printf '%f\n' | sort)
          fi

          if [ -z "$PROJECT_ZIP" ]; then
            echo "ERRO: nenhum ZIP valido do J.Pastore Sports AI foi encontrado."
            echo "O ZIP precisa conter JPASTORE_SPORTS_AI_ANDROID/ e applicationId com.jpastore.sportsai."
            exit 1
          fi

          echo "Projeto selecionado: $PROJECT_ZIP"
          sha256sum "$PROJECT_ZIP"
          echo "PROJECT_ZIP=$PROJECT_ZIP" >> "$GITHUB_ENV"

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK e API 35
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n 1 || true)"

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager nao encontrado no GitHub Runner."
            find "$ANDROID_HOME" -maxdepth 5 -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "Usando sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true

          PACKAGES=()
          [ -d "$ANDROID_HOME/platform-tools" ] || PACKAGES+=("platform-tools")
          [ -d "$ANDROID_HOME/platforms/android-35" ] || PACKAGES+=("platforms;android-35")
          [ -d "$ANDROID_HOME/build-tools/35.0.0" ] || PACKAGES+=("build-tools;35.0.0")

          if [ "${#PACKAGES[@]}" -gt 0 ]; then
            "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "${PACKAGES[@]}"
          fi

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descompactar projeto
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-src output
          mkdir -p build-src output
          unzip -q "$PROJECT_ZIP" -d build-src

          ROOT=build-src/JPASTORE_SPORTS_AI_ANDROID
          test -f "$ROOT/settings.gradle"
          test -f "$ROOT/app/build.gradle"
          test -f "$ROOT/app/src/main/AndroidManifest.xml"

          grep -Eq "applicationId[[:space:]]+['\"]com\.jpastore\.sportsai['\"]" "$ROOT/app/build.gradle" || {
            echo "ERRO: applicationId divergente."
            exit 1
          }

          VERSION_CODE="$(sed -nE 's/.*versionCode[[:space:]]+([0-9]+).*/\1/p' "$ROOT/app/build.gradle" | head -n1 || true)"
          VERSION_NAME="$(sed -nE "s/.*versionName[[:space:]]+['\"]([^'\"]+)['\"].*/\1/p" "$ROOT/app/build.gradle" | head -n1 || true)"

          echo "J.Pastore Sports AI"
          echo "versionCode: ${VERSION_CODE:-nao identificado}"
          echo "versionName: ${VERSION_NAME:-nao identificado}"
          echo "APP_VERSION_CODE=${VERSION_CODE:-unknown}" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=${VERSION_NAME:-unknown}" >> "$GITHUB_ENV"

      - name: Confirmar versão 6.10.6 Ticket Fallback
        shell: bash
        run: |
          set -euo pipefail
          ROOT=build-src/JPASTORE_SPORTS_AI_ANDROID
          test "${APP_VERSION_CODE}" = "69" || { echo "ERRO: projeto não é versionCode 69 (6.10.6)."; exit 1; }
          grep -Fq "6.10.6-ticket-fallback" "$ROOT/app/build.gradle" || { echo "ERRO: versionName 6.10.6 não encontrado."; exit 1; }
          test -f "$ROOT/FULL_ANALYSIS_BUILD_6_10_1" || { echo "ERRO: marcador 6.10.1 ausente."; exit 1; }
          SRC="$ROOT/app/src/main/java/com/jpastore/sportsai"
          WEB="$SRC/MultiSportWebClient.java"
          MULTI="$SRC/MultiSportClient.java"
          API="$SRC/ApiClient.java"
          CONS="$SRC/SportConsensusEngine.java"
          TICKET="$SRC/SportTicketEngine.java"
          UI="$SRC/PremiumView.java"

          # Núcleo existente preservado
          test -f "$SRC/ProductionTuningEngine.java" || { echo "ERRO: Production Tuning Engine ausente."; exit 1; }
          test -f "$SRC/EventStandards.java" || { echo "ERRO: normalização central de status/horário ausente."; exit 1; }
          test -f "$SRC/SportPresentationRules.java" || { echo "ERRO: regras de apresentação por esporte ausentes."; exit 1; }
          test -f "$SRC/TeamIdentityResolver.java" || { echo "ERRO: resolvedor de aliases ausente."; exit 1; }
          test -f "$SRC/StatisticalCalibrationEngine.java" || { echo "ERRO: motor de calibração ausente."; exit 1; }
          test -f "$SRC/MarketOddsBook.java" || { echo "ERRO: livro de odds ausente."; exit 1; }
          test -f "$SRC/LiveAnalysisEngine.java" || { echo "ERRO: modelo LIVE separado ausente."; exit 1; }
          grep -Fq 'weightedFor' "$SRC/ProductionTuningEngine.java" || { echo "ERRO: médias ponderadas ausentes."; exit 1; }
          grep -Fq 'backToBackSeries' "$SRC/ProductionTuningEngine.java" || { echo "ERRO: back-to-back ausente."; exit 1; }
          grep -Fq 'expectedTotal' "$SRC/ProductionTuningEngine.java" || { echo "ERRO: total esperado do basquete ausente."; exit 1; }
          grep -Fq 'projectedMargin' "$SRC/ProductionTuningEngine.java" || { echo "ERRO: margem projetada ausente."; exit 1; }
          grep -Fq 'buildNote' "$CONS" || { echo "ERRO: classificação funcional das fontes ausente."; exit 1; }
          grep -Fq 'favoriteConvergence' "$CONS" || { echo "ERRO: convergência entre fontes ausente."; exit 1; }
          grep -Fq 'sourceConvergence=' "$TICKET" || { echo "ERRO: log de auditoria da convergência ausente."; exit 1; }
          grep -Fq 'confidenceScore' "$TICKET" || { echo "ERRO: Confidence Score ausente."; exit 1; }
          grep -Fq 'jointProbability' "$SRC/TicketStore.java" || { echo "ERRO: probabilidade conjunta do bilhete ausente."; exit 1; }

          # Multi-API e agenda
          grep -Fq 'loadPublicSchedule' "$MULTI" || { echo "ERRO: agenda pública ausente."; exit 1; }
          grep -Fq 'loadEspnSchedule' "$MULTI" || { echo "ERRO: ESPN fallback ausente."; exit 1; }
          grep -Fq 'loadSportsDbSchedule' "$MULTI" || { echo "ERRO: TheSportsDB fallback ausente."; exit 1; }
          grep -Fq 'loadOpenWebSchedule' "$MULTI" || { echo "ERRO: web fallback ausente."; exit 1; }
          grep -Fq 'apiCircuitOpen' "$MULTI" || { echo "ERRO: circuit breaker ausente."; exit 1; }
          grep -Fq 'homeDisplayGames' "$UI" || { echo "ERRO: agenda ampla da home ausente."; exit 1; }
          grep -Fq 'TimePicker picker' "$ROOT/app/src/main/java/com/jpastore/sportsai/MainActivity.java" || { echo "ERRO: relógio configurável ausente."; exit 1; }
          grep -Fq 'picker.setMinute' "$ROOT/app/src/main/java/com/jpastore/sportsai/MainActivity.java" || { echo "ERRO: seleção livre de minutos ausente."; exit 1; }

          # APIs configuráveis preservadas
          test -f "$SRC/FiveDollarFootballClient.java" || { echo "ERRO: cliente 5Dollar ausente."; exit 1; }
          test -f "$SRC/HighlightlyBasketballClient.java" || { echo "ERRO: cliente Highlightly ausente."; exit 1; }
          grep -Fq 'api_5dollar' "$SRC/FiveDollarFootballClient.java" || { echo "ERRO: chave 5Dollar não persistida."; exit 1; }
          grep -Fq 'api_highlightly_basketball' "$SRC/HighlightlyBasketballClient.java" || { echo "ERRO: chave Highlightly não persistida."; exit 1; }
          grep -Fq 'fiveDollarApiDialog()' "$UI" || { echo "ERRO: diálogo 5Dollar ausente."; exit 1; }
          grep -Fq 'highlightlyBasketballApiDialog()' "$UI" || { echo "ERRO: diálogo Highlightly ausente."; exit 1; }

          # Hotfix de velocidade 6.10.1
          grep -Fq 'forceDeep?15000L:4200L' "$API" || { echo "ERRO: limite total da análise automática ausente."; exit 1; }
          grep -Fq 'forceDeep?7000L:2200L' "$API" || { echo "ERRO: janela rápida 2,2 s ausente."; exit 1; }
          grep -Fq 'forceDeep?6200L:850L' "$API" || { echo "ERRO: limite do consenso web ausente."; exit 1; }
          grep -Fq 'forceDeep?5000L:550L' "$API" || { echo "ERRO: fallback rápido API-Football ausente."; exit 1; }
          grep -Fq 'forceDeep?2500L:450L' "$API" || { echo "ERRO: fallback de gols com timeout ausente."; exit 1; }
          grep -Fq 'forceDeep?1100L:450L' "$API" || { echo "ERRO: timeout curto de odds ausente."; exit 1; }

          # Hotfix de logos 6.10.1
          grep -Fq 'resolveSofaBadge' "$UI" || { echo "ERRO: resolver SofaScore por nome ausente."; exit 1; }
          grep -Fq 'api.sofascore.com/api/v1/search/all/' "$UI" || { echo "ERRO: busca de time SofaScore ausente."; exit 1; }
          grep -Fq 'teamLogo(ho)' "$SRC/FiveDollarFootballClient.java" || { echo "ERRO: logo 5Dollar mandante não preservado."; exit 1; }
          grep -Fq 'teamLogo(aw)' "$SRC/FiveDollarFootballClient.java" || { echo "ERRO: logo 5Dollar visitante não preservado."; exit 1; }
          grep -Fq 'teamInitials' "$UI" || { echo "ERRO: fallback por iniciais ausente."; exit 1; }
          if grep -Fq 'center(c,"FC"' "$UI"; then echo "ERRO: fallback genérico FC reapareceu."; exit 1; fi
          grep -Fq 'JP-SPEED-LOGO-HOTFIX-6.10.1' "$UI" || { echo "ERRO: marcador interno 6.10.1 ausente."; exit 1; }

          # Market Collector 6.10.3
          test -f "$ROOT/FULL_ANALYSIS_BUILD_6_10_3" || { echo "ERRO: marcador 6.10.3 ausente."; exit 1; }
          test -f "$SRC/MarketCollector.java" || { echo "ERRO: MarketCollector central ausente."; exit 1; }
          grep -Fq 'sofaId' "$MULTI" || { echo "ERRO: ID específico SofaScore ausente."; exit 1; }
          grep -Fq 'apiSportsId' "$MULTI" || { echo "ERRO: ID específico API-Sports ausente."; exit 1; }
          grep -Fq 'new MarketCollector(c).collect' "$WEB" || { echo "ERRO: Research Engine ainda não usa o coletor central."; exit 1; }
          grep -Fq '/odds/1/all' "$SRC/MarketCollector.java" || { echo "ERRO: fonte pública de odds SofaScore ausente."; exit 1; }
          grep -Fq 'resolveApiEvent' "$SRC/MarketCollector.java" || { echo "ERRO: resolução de evento API-Sports ausente."; exit 1; }
          grep -Fq 'availabilityLabel' "$SRC/MarketOddsBook.java" || { echo "ERRO: estados de disponibilidade de mercado ausentes."; exit 1; }
          grep -Fq 'marketAvailability' "$SRC/TicketStore.java" || { echo "ERRO: estado de coleta não chega ao bilhete."; exit 1; }

          # Agenda + Ticket Optimizer 6.10.4
          test -f "$ROOT/FULL_ANALYSIS_BUILD_6_10_4" || { echo "ERRO: marcador 6.10.4 ausente."; exit 1; }
          grep -Fq 'expandFixtures' "$API" || { echo "ERRO: segunda passagem da agenda ausente."; exit 1; }
          grep -Fq 'soccer/bra.1' "$MULTI" || { echo "ERRO: cobertura ESPN de futebol ampliada ausente."; exit 1; }
          grep -Fq 'buildSportMultiTicketBatch' "$UI" || { echo "ERRO: gerador paralelo de múltiplos ausente."; exit 1; }
          grep -Fq 'Math.min(4,queue.size())' "$UI" || { echo "ERRO: limite de concorrência do bilhete ausente."; exit 1; }
          grep -Fq 'marketOnlyFallback' "$TICKET" || { echo "ERRO: fallback de mercado real ausente."; exit 1; }
          grep -Fq 'rescue.marketOdds' "$UI" || { echo "ERRO: resgate direto de odds ausente."; exit 1; }
          grep -Fq 'pickLimit=multi?Math.min(1' "$SRC/TicketStore.java" || { echo "ERRO: regra de uma seleção por confronto ausente."; exit 1; }
          grep -Fq 'marketEvidence' "$WEB" || { echo "ERRO: odds reais não estão sendo aceitas como evidência."; exit 1; }
          # 6.10.4 é validada pelas funções acima e pelo teste de regressão; não exigir string-marcador legado na UI.

          # Structural Flow 6.10.5
          test -f "$ROOT/FULL_ANALYSIS_BUILD_6_10_5" || { echo "ERRO: marcador 6.10.5 ausente."; exit 1; }
          test -f "$SRC/HomeFlowCore.java" || { echo "ERRO: pipeline puro da home ausente."; exit 1; }
          test -f "$SRC/TicketBatchGenerator.java" || { echo "ERRO: gerador de lote de bilhetes ausente."; exit 1; }
          test -f "$SRC/GeneratedTicketStore.java" || { echo "ERRO: persistência de bilhetes gerados ausente."; exit 1; }
          grep -Fq '[JP_HOME]' "$UI" || { echo "ERRO: logs JP_HOME ausentes."; exit 1; }
          grep -Fq '[JP_TICKETS]' "$UI" || { echo "ERRO: logs JP_TICKETS ausentes."; exit 1; }
          grep -Fq 'paging.optInt("total"' "$MULTI" || { echo "ERRO: paginação da API multiesporte ausente."; exit 1; }
          grep -Fq 'fetchApiFootballFixtures' "$API" || { echo "ERRO: paginação API-Football ausente."; exit 1; }
          grep -Fq 'GeneratedTicketStore' "$UI" || { echo "ERRO: armazenamento de bilhetes individuais não integrado."; exit 1; }
          grep -Fq 'SEM SELEÇÃO CONSERVADORA' "$TICKET" || { echo "ERRO: bloqueio conservador ausente."; exit 1; }
          grep -Fq 'JP-STRUCTURAL-FLOW-6.10.5' "$UI" || { echo "ERRO: marcador interno 6.10.5 ausente."; exit 1; }


          # Ticket Fallback 6.10.6
          test -f "$ROOT/FULL_ANALYSIS_BUILD_6_10_6" || { echo "ERRO: marcador 6.10.6 ausente."; exit 1; }
          test -f "$SRC/InitialPredictionTicketFactory.java" || { echo "ERRO: factory de fallback da predição inicial ausente."; exit 1; }
          grep -Fq 'JP-BASIC-TICKET-FALLBACK-6.10.6' "$SRC/TicketStore.java" || { echo "ERRO: fallback manual 6.10.6 ausente."; exit 1; }
          grep -Fq 'sportMultiMode=SportTicketEngine.EQUILIBRADO' "$UI" || { echo "ERRO: modo inicial do lote não está EQUILIBRADO."; exit 1; }
          grep -Fq 'InitialPredictionTicketFactory.football' "$UI" || { echo "ERRO: fallback da predição inicial não integrado ao lote."; exit 1; }
          echo "Versão 6.10.6 validada: bilhete sem bloqueio da análise profunda + lote com fallback inicial."

      - name: Rodar 12 testes Production Tuning
        working-directory: build-src/JPASTORE_SPORTS_AI_ANDROID
        shell: bash
        run: |
          set -euo pipefail
          bash tools/run-production-tuning-tests.sh

      - name: Rodar 10 testes Speed + Logo Hotfix
        shell: bash
        run: |
          set -euo pipefail
          bash build-src/JPASTORE_SPORTS_AI_ANDROID/tools/speed-logo-hotfix-selftest.sh build-src/JPASTORE_SPORTS_AI_ANDROID

      - name: Rodar testes do Logo Optimizer
        shell: bash
        run: |
          set -euo pipefail
          bash build-src/JPASTORE_SPORTS_AI_ANDROID/tools/logo-optimizer-selftest.sh build-src/JPASTORE_SPORTS_AI_ANDROID

      - name: Rodar 20 testes do motor estatístico calibrado
        working-directory: build-src/JPASTORE_SPORTS_AI_ANDROID
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/jp-ai-tests && mkdir -p /tmp/jp-ai-tests
          javac -encoding UTF-8 -d /tmp/jp-ai-tests \
            app/src/main/java/com/jpastore/sportsai/EventStandards.java \
            app/src/main/java/com/jpastore/sportsai/StatisticalCalibrationEngine.java \
            app/src/main/java/com/jpastore/sportsai/MarketOddsBook.java \
            tools/StatisticalCalibrationEngineSelfTest.java
          java -cp /tmp/jp-ai-tests com.jpastore.sportsai.StatisticalCalibrationEngineSelfTest

      - name: Rodar testes do Market Collector 6.10.3
        working-directory: build-src/JPASTORE_SPORTS_AI_ANDROID
        shell: bash
        run: |
          set -euo pipefail
          bash tools/run-market-collector-tests.sh

      - name: Rodar regressão Agenda + Bilhete 6.10.4
        working-directory: build-src/JPASTORE_SPORTS_AI_ANDROID
        shell: bash
        run: |
          set -euo pipefail
          bash tools/agenda-ticket-optimizer-selftest.sh .

      - name: Rodar testes estruturais Home + Bilhetes 6.10.5
        working-directory: build-src/JPASTORE_SPORTS_AI_ANDROID
        shell: bash
        run: |
          set -euo pipefail
          bash tools/structural-flow-selftest.sh


      - name: Rodar testes Ticket Fallback 6.10.6
        working-directory: build-src/JPASTORE_SPORTS_AI_ANDROID
        shell: bash
        run: |
          set -euo pipefail
          bash tools/initial-ticket-fallback-selftest.sh

      - name: Compilar APK com retry anti-429
        working-directory: build-src/JPASTORE_SPORTS_AI_ANDROID
        shell: bash
        run: |
          set -euo pipefail

          # Reduz concorrencia para evitar rajadas de downloads no Maven Central.
          export GRADLE_OPTS="-Dorg.gradle.workers.max=2 -Dorg.gradle.parallel=false -Dorg.gradle.daemon=false"

          MAX_ATTEMPTS=4
          for ATTEMPT in $(seq 1 $MAX_ATTEMPTS); do
            echo "Tentativa $ATTEMPT de $MAX_ATTEMPTS para compilar o APK..."
            LOG="/tmp/jpastore-gradle-${ATTEMPT}.log"

            set +e
            gradle --no-daemon --max-workers=2 :app:assembleDebug 2>&1 | tee "$LOG"
            CODE=${PIPESTATUS[0]}
            set -e

            if [ "$CODE" -eq 0 ]; then
              echo "Compilacao concluida com sucesso."
              exit 0
            fi

            # Retry somente para falhas transitórias de rede/repositório.
            if grep -Eqi '429|Too Many Requests|Could not GET|Could not resolve|Read timed out|Connection reset|Temporary failure|503 Service Unavailable' "$LOG"; then
              if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
                WAIT=$((ATTEMPT * 45))
                echo "Falha temporaria de rede/dependencias. Aguardando ${WAIT}s antes de tentar novamente..."
                sleep "$WAIT"
                continue
              fi
            else
              echo "ERRO de codigo/compilacao detectado. Nao sera repetido 4 vezes."
              grep -nE 'error:|cannot find symbol|incompatible types|not a statement|illegal start|unclosed' "$LOG" | tail -n 40 || true
              exit "$CODE"
            fi
          done

          echo "ERRO: a compilacao falhou apos $MAX_ATTEMPTS tentativas de rede."
          exit 1

      - name: Localizar e validar APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find build-src/JPASTORE_SPORTS_AI_ANDROID/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERRO: APK nao encontrado."
            exit 1
          fi

          cp "$APK" output/JPASTORE-Sports-AI.apk
          test -s output/JPASTORE-Sports-AI.apk
          ls -lh output/JPASTORE-Sports-AI.apk
          sha256sum output/JPASTORE-Sports-AI.apk

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: JPASTORE-Sports-AI-6.10.6-APK
          path: output/JPASTORE-Sports-AI.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
