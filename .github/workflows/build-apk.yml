name: Gerar APK J.Pastore Sports AI

on:
  workflow_dispatch:
  push:
    branches: [ main, principal ]
    paths:
      - 'JPASTORE_SPORTS_AI_ANDROID_PROJECT*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Localizar projeto J.Pastore Sports AI
        shell: bash
        run: |
          set -euo pipefail

          is_valid_project() {
            local z="$1"
            [ -f "$z" ] || return 1

            unzip -l "$z" JPASTORE_SPORTS_AI_ANDROID/settings.gradle 2>/dev/null | grep -Fq "settings.gradle" || return 1
            unzip -l "$z" JPASTORE_SPORTS_AI_ANDROID/app/build.gradle 2>/dev/null | grep -Fq "app/build.gradle" || return 1
            unzip -l "$z" JPASTORE_SPORTS_AI_ANDROID/app/src/main/AndroidManifest.xml 2>/dev/null | grep -Fq "AndroidManifest.xml" || return 1

            local gradle
            gradle="$(unzip -p "$z" JPASTORE_SPORTS_AI_ANDROID/app/build.gradle 2>/dev/null || true)"
            printf '%s\n' "$gradle" | grep -Eq "applicationId[[:space:]]+['\"]com\.jpastore\.sportsai['\"]" || return 1

            return 0
          }

          PROJECT_ZIP=""

          # 1) Em push, prioriza um ZIP valido alterado neste commit.
          if [ "${{ github.event_name }}" = "push" ]; then
            while IFS= read -r candidate; do
              [ -n "$candidate" ] || continue
              if [[ "$candidate" =~ ^JPASTORE_SPORTS_AI_ANDROID_PROJECT.*\.zip$ ]] && is_valid_project "$candidate"; then
                PROJECT_ZIP="$candidate"
              fi
            done < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" || true)
          fi

          # 2) Prefere o nome oficial quando valido.
          if [ -z "$PROJECT_ZIP" ] && is_valid_project "JPASTORE_SPORTS_AI_ANDROID_PROJECT.zip"; then
            PROJECT_ZIP="JPASTORE_SPORTS_AI_ANDROID_PROJECT.zip"
          fi

          # 3) Fallback: escolhe o ZIP valido mais recente no historico do Git.
          if [ -z "$PROJECT_ZIP" ]; then
            BEST_TS=0
            while IFS= read -r candidate; do
              [ -n "$candidate" ] || continue
              if is_valid_project "$candidate"; then
                TS="$(git log -1 --format=%ct -- "$candidate" 2>/dev/null || echo 0)"
                TS="${TS:-0}"
                if [ "$TS" -ge "$BEST_TS" ]; then
                  BEST_TS="$TS"
                  PROJECT_ZIP="$candidate"
                fi
              fi
            done < <(find . -maxdepth 1 -type f -name 'JPASTORE_SPORTS_AI_ANDROID_PROJECT*.zip' -printf '%f\n' | sort)
          fi

          if [ -z "$PROJECT_ZIP" ]; then
            echo "ERRO: nenhum ZIP valido do J.Pastore Sports AI foi encontrado."
            echo "O ZIP precisa conter JPASTORE_SPORTS_AI_ANDROID/ e applicationId com.jpastore.sportsai."
            exit 1
          fi

          echo "Projeto selecionado: $PROJECT_ZIP"
          sha256sum "$PROJECT_ZIP"
          echo "PROJECT_ZIP=$PROJECT_ZIP" >> "$GITHUB_ENV"

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK e API 35
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n 1 || true)"

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager nao encontrado no GitHub Runner."
            find "$ANDROID_HOME" -maxdepth 5 -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "Usando sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true

          PACKAGES=()
          [ -d "$ANDROID_HOME/platform-tools" ] || PACKAGES+=("platform-tools")
          [ -d "$ANDROID_HOME/platforms/android-35" ] || PACKAGES+=("platforms;android-35")
          [ -d "$ANDROID_HOME/build-tools/35.0.0" ] || PACKAGES+=("build-tools;35.0.0")

          if [ "${#PACKAGES[@]}" -gt 0 ]; then
            "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "${PACKAGES[@]}"
          fi

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descompactar projeto
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-src output
          mkdir -p build-src output
          unzip -q "$PROJECT_ZIP" -d build-src

          ROOT=build-src/JPASTORE_SPORTS_AI_ANDROID
          test -f "$ROOT/settings.gradle"
          test -f "$ROOT/app/build.gradle"
          test -f "$ROOT/app/src/main/AndroidManifest.xml"

          grep -Eq "applicationId[[:space:]]+['\"]com\.jpastore\.sportsai['\"]" "$ROOT/app/build.gradle" || {
            echo "ERRO: applicationId divergente."
            exit 1
          }

          VERSION_CODE="$(sed -nE 's/.*versionCode[[:space:]]+([0-9]+).*/\1/p' "$ROOT/app/build.gradle" | head -n1 || true)"
          VERSION_NAME="$(sed -nE "s/.*versionName[[:space:]]+['\"]([^'\"]+)['\"].*/\1/p" "$ROOT/app/build.gradle" | head -n1 || true)"

          echo "J.Pastore Sports AI"
          echo "versionCode: ${VERSION_CODE:-nao identificado}"
          echo "versionName: ${VERSION_NAME:-nao identificado}"
          echo "APP_VERSION_CODE=${VERSION_CODE:-unknown}" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=${VERSION_NAME:-unknown}" >> "$GITHUB_ENV"

      - name: Confirmar versão 6.10.1 Speed + Logo Hotfix
        shell: bash
        run: |
          set -euo pipefail
          ROOT=build-src/JPASTORE_SPORTS_AI_ANDROID
          SRC="$ROOT/app/src/main/java/com/jpastore/sportsai"
          API="$SRC/ApiClient.java"
          WEB="$SRC/MultiSportWebClient.java"
          UI="$SRC/PremiumView.java"
          CONS="$SRC/SportConsensusEngine.java"

          test "${APP_VERSION_CODE}" = "64" || { echo "ERRO: projeto não é versionCode 64 (6.10.1)."; exit 1; }
          grep -Fq "6.10.1-speed-logo-hotfix" "$ROOT/app/build.gradle" || { echo "ERRO: versionName 6.10.1 não encontrado."; exit 1; }
          test -f "$ROOT/FULL_ANALYSIS_BUILD_6_10_1" || { echo "ERRO: marcador 6.10.1 ausente."; exit 1; }

          for f in ProductionTuningEngine.java EventStandards.java SportPresentationRules.java StatisticalCalibrationEngine.java SportTicketEngine.java TeamIdentityResolver.java; do
            test -f "$SRC/$f" || { echo "ERRO: módulo obrigatório ausente: $f"; exit 1; }
          done
          grep -Fq 'weightedFor' "$SRC/ProductionTuningEngine.java" || { echo "ERRO: médias ponderadas ausentes."; exit 1; }
          grep -Fq 'recencyWeight' "$SRC/ProductionTuningEngine.java" || { echo "ERRO: recência ponderada ausente."; exit 1; }
          grep -Fq 'backToBackSeries' "$SRC/ProductionTuningEngine.java" || { echo "ERRO: back-to-back ausente."; exit 1; }
          grep -Fq 'expectedTotal' "$SRC/ProductionTuningEngine.java" || { echo "ERRO: total projetado ausente."; exit 1; }
          grep -Fq 'sourceConvergence' "$SRC/SportTicketEngine.java" || { echo "ERRO: convergência de fontes não auditada."; exit 1; }
          grep -Fq 'buildNote' "$CONS" || { echo "ERRO: classificação funcional do consenso ausente."; exit 1; }
          grep -Fq 'jointProbability' "$SRC/TicketStore.java" || { echo "ERRO: probabilidade conjunta ausente."; exit 1; }

          test -f "$SRC/FiveDollarFootballClient.java" || { echo "ERRO: 5Dollar ausente."; exit 1; }
          test -f "$SRC/HighlightlyBasketballClient.java" || { echo "ERRO: Highlightly ausente."; exit 1; }
          grep -Fq 'FiveDollarFootballClient.SOURCE.equals(selectedApiSource)' "$UI" || { echo "ERRO: 5Dollar não ligada à UI."; exit 1; }
          grep -Fq 'HighlightlyBasketballClient.SOURCE.equals(selectedApiSource)' "$UI" || { echo "ERRO: Highlightly não ligada à UI."; exit 1; }
          grep -Fq 'fiveDollarApiDialog()' "$UI" || { echo "ERRO: diálogo 5Dollar ausente."; exit 1; }
          grep -Fq 'highlightlyBasketballApiDialog()' "$UI" || { echo "ERRO: diálogo Highlightly ausente."; exit 1; }

          grep -Fq 'forceDeep?15000L:4200L' "$API" || { echo "ERRO: orçamento total rápido 6.10.1 ausente."; exit 1; }
          grep -Fq 'forceDeep?5000L:550L' "$API" || { echo "ERRO: fallback rápido API-Football ausente."; exit 1; }
          grep -Fq 'ensureGoalFallbackTimed' "$API" || { echo "ERRO: fallback OpenFootball ainda pode bloquear."; exit 1; }
          grep -Fq 'forceDeep?4500L:350L' "$API" || { echo "ERRO: orçamento do fallback de gols ausente."; exit 1; }

          grep -Fq 'String resolveSofaBadge' "$WEB" || { echo "ERRO: resolvedor rápido SofaScore ausente."; exit 1; }
          grep -Fq 'h.setConnectTimeout(1200);h.setReadTimeout(1600);' "$WEB" || { echo "ERRO: orçamento rápido do resolvedor de logos ausente."; exit 1; }
          grep -Fq 'resolveSofaBadge(sport,team)' "$UI" || { echo "ERRO: resolvedor SofaScore não ligado à UI."; exit 1; }
          grep -Fq 'logoField(ho)' "$SRC/FiveDollarFootballClient.java" || { echo "ERRO: logos 5Dollar não preservados."; exit 1; }
          grep -Fq 'www.thesportsdb.com/api/v1/json/123/searchteams.php' "$UI" || { echo "ERRO: fallback TheSportsDB ausente."; exit 1; }
          grep -Fq 'en.wikipedia.org/api/rest_v1/page/summary/' "$UI" || { echo "ERRO: fallback Wikipedia ausente."; exit 1; }
          if grep -Fq 'center(c,"FC"' "$UI"; then echo "ERRO: fallback genérico FC reapareceu."; exit 1; fi

          grep -Fq 'picker.setMinute(chosen[1])' "$SRC/MainActivity.java" || { echo "ERRO: seletor de minuto livre ausente."; exit 1; }
          echo "Versão 6.10.1 validada: speed budget + logos multi-fonte + Production Tuning."

      - name: Rodar testes Production Tuning
        working-directory: build-src/JPASTORE_SPORTS_AI_ANDROID
        shell: bash
        run: |
          set -euo pipefail
          bash tools/run-production-tuning-tests.sh

      - name: Rodar testes do Logo Optimizer
        working-directory: build-src/JPASTORE_SPORTS_AI_ANDROID
        shell: bash
        run: |
          set -euo pipefail
          bash tools/logo-optimizer-selftest.sh .

      - name: Rodar testes do motor estatístico calibrado
        working-directory: build-src/JPASTORE_SPORTS_AI_ANDROID
        shell: bash
        run: |
          set -euo pipefail
          bash tools/run-statistical-tests.sh

      - name: Rodar testes Speed + Logo 6.10.1
        working-directory: build-src/JPASTORE_SPORTS_AI_ANDROID
        shell: bash
        run: |
          set -euo pipefail
          bash tools/speed-logo-hotfix-selftest.sh .

      - name: Compilar APK com retry anti-429
        working-directory: build-src/JPASTORE_SPORTS_AI_ANDROID
        shell: bash
        run: |
          set -euo pipefail

          # Reduz concorrencia para evitar rajadas de downloads no Maven Central.
          export GRADLE_OPTS="-Dorg.gradle.workers.max=2 -Dorg.gradle.parallel=false -Dorg.gradle.daemon=false"

          MAX_ATTEMPTS=4
          for ATTEMPT in $(seq 1 $MAX_ATTEMPTS); do
            echo "Tentativa $ATTEMPT de $MAX_ATTEMPTS para compilar o APK..."
            LOG="/tmp/jpastore-gradle-${ATTEMPT}.log"

            set +e
            gradle --no-daemon --max-workers=2 :app:assembleDebug 2>&1 | tee "$LOG"
            CODE=${PIPESTATUS[0]}
            set -e

            if [ "$CODE" -eq 0 ]; then
              echo "Compilacao concluida com sucesso."
              exit 0
            fi

            # Retry somente para falhas transitórias de rede/repositório.
            if grep -Eqi '429|Too Many Requests|Could not GET|Could not resolve|Read timed out|Connection reset|Temporary failure|503 Service Unavailable' "$LOG"; then
              if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
                WAIT=$((ATTEMPT * 45))
                echo "Falha temporaria de rede/dependencias. Aguardando ${WAIT}s antes de tentar novamente..."
                sleep "$WAIT"
                continue
              fi
            else
              echo "ERRO de codigo/compilacao detectado. Nao sera repetido 4 vezes."
              grep -nE 'error:|cannot find symbol|incompatible types|not a statement|illegal start|unclosed' "$LOG" | tail -n 40 || true
              exit "$CODE"
            fi
          done

          echo "ERRO: a compilacao falhou apos $MAX_ATTEMPTS tentativas de rede."
          exit 1

      - name: Localizar e validar APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find build-src/JPASTORE_SPORTS_AI_ANDROID/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERRO: APK nao encontrado."
            exit 1
          fi

          cp "$APK" output/JPASTORE-Sports-AI.apk
          test -s output/JPASTORE-Sports-AI.apk
          ls -lh output/JPASTORE-Sports-AI.apk
          sha256sum output/JPASTORE-Sports-AI.apk

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: JPASTORE-Sports-AI-APK
          path: output/JPASTORE-Sports-AI.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
