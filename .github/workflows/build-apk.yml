name: Gerar APK J.Pastore Sports AI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'JPASTORE_SPORTS_AI_ANDROID_PROJECT.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android API 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descompactar projeto
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q JPASTORE_SPORTS_AI_ANDROID_PROJECT.zip -d build-src
          echo "Conteudo extraido:"
          find build-src -maxdepth 3 -type f | sort

      - name: Compilar APK
        working-directory: build-src/JPASTORE_SPORTS_AI_ANDROID
        run: gradle --no-daemon :app:assembleDebug

      - name: Preparar APK para download
        run: |
          mkdir -p output
          cp build-src/JPASTORE_SPORTS_AI_ANDROID/app/build/outputs/apk/debug/app-debug.apk output/JPASTORE-Sports-AI.apk
          ls -lh output/

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: JPASTORE-Sports-AI-APK
          path: output/JPASTORE-Sports-AI.apk
          if-no-files-found: error
          retention-days: 30
          
